<svg xmlns="http://www.w3.org/2000/svg" width="780" height="630" viewBox="0 0 780 630">
  <title>Decoding 100,000 HS256 tokens</title>
  <desc>10 JWT libraries each decode 100,000 tokens (HS256 with a 64-byte secret, a typical 661-byte token), the bars filling in real time. ryjwt → Struct (Python) finishes in 0.22s, jwcrypto (Python) in 10.76s. Versions: ryjwt 0.1.0 → Struct, ryjwt 0.1.0 → dict, ryjwt 0.1.0 → BaseModel, jsonwebtoken 11.1.0 (aws-lc-rs), fast-jwt 6.3.3, jose 6.2.12, python-jose 3.5.0, joserfc 1.7.5, pyjwt 2.15.1, jwcrypto 1.6.1.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .title { font-size: 15px; fill: #0b0b0b; font-weight: 600; }
    .tick { font-size: 10px; fill: #898781; }
    .name { font-size: 13px; fill: #0b0b0b; font-weight: 600; }
    .rate { font-size: 10px; fill: #52514e; }
    .caption { font-size: 11px; fill: #52514e; }
    .badge { font-size: 12px; font-weight: 700; }
    .speedup { font-size: 11px; font-weight: 600; fill: #52514e; }
    .track { fill: #f3f2ef; stroke: #e1e0d9; }
    .grid { stroke: #e1e0d9; stroke-width: 1; }
    .playhead { stroke: #0b0b0b; stroke-width: 1.5; opacity: 0.55; }

    /* One 13.757s loop: the race runs for the first 78.194%
       (10.757s, the slowest library's time), then every bar holds
       for 3s, so the finish times can be read, before it restarts. */
    #playhead { animation: playhead 13.757s linear infinite; }
    #bar-ryjwt-msgspec { animation: fill-ryjwt-msgspec 13.757s linear infinite; }
    #badge-ryjwt-msgspec { animation: show-ryjwt-msgspec 13.757s step-end infinite; }
    @keyframes fill-ryjwt-msgspec { 0% { width: 0; } 1.595% { width: 390px; } 100% { width: 390px; } }
    @keyframes show-ryjwt-msgspec { 0% { opacity: 0; } 1.595% { opacity: 1; } 100% { opacity: 1; } }
    #bar-ryjwt { animation: fill-ryjwt 13.757s linear infinite; }
    #badge-ryjwt { animation: show-ryjwt 13.757s step-end infinite; }
    @keyframes fill-ryjwt { 0% { width: 0; } 1.743% { width: 390px; } 100% { width: 390px; } }
    @keyframes show-ryjwt { 0% { opacity: 0; } 1.743% { opacity: 1; } 100% { opacity: 1; } }
    #bar-ryjwt-pydantic { animation: fill-ryjwt-pydantic 13.757s linear infinite; }
    #badge-ryjwt-pydantic { animation: show-ryjwt-pydantic 13.757s step-end infinite; }
    @keyframes fill-ryjwt-pydantic { 0% { width: 0; } 3.364% { width: 390px; } 100% { width: 390px; } }
    @keyframes show-ryjwt-pydantic { 0% { opacity: 0; } 3.364% { opacity: 1; } 100% { opacity: 1; } }
    #bar-jsonwebtoken { animation: fill-jsonwebtoken 13.757s linear infinite; }
    #badge-jsonwebtoken { animation: show-jsonwebtoken 13.757s step-end infinite; }
    @keyframes fill-jsonwebtoken { 0% { width: 0; } 3.774% { width: 390px; } 100% { width: 390px; } }
    @keyframes show-jsonwebtoken { 0% { opacity: 0; } 3.774% { opacity: 1; } 100% { opacity: 1; } }
    #bar-fast-jwt { animation: fill-fast-jwt 13.757s linear infinite; }
    #badge-fast-jwt { animation: show-fast-jwt 13.757s step-end infinite; }
    @keyframes fill-fast-jwt { 0% { width: 0; } 4.550% { width: 390px; } 100% { width: 390px; } }
    @keyframes show-fast-jwt { 0% { opacity: 0; } 4.550% { opacity: 1; } 100% { opacity: 1; } }
    #bar-jose { animation: fill-jose 13.757s linear infinite; }
    #badge-jose { animation: show-jose 13.757s step-end infinite; }
    @keyframes fill-jose { 0% { width: 0; } 15.033% { width: 390px; } 100% { width: 390px; } }
    @keyframes show-jose { 0% { opacity: 0; } 15.033% { opacity: 1; } 100% { opacity: 1; } }
    #bar-python-jose { animation: fill-python-jose 13.757s linear infinite; }
    #badge-python-jose { animation: show-python-jose 13.757s step-end infinite; }
    @keyframes fill-python-jose { 0% { width: 0; } 21.471% { width: 390px; } 100% { width: 390px; } }
    @keyframes show-python-jose { 0% { opacity: 0; } 21.471% { opacity: 1; } 100% { opacity: 1; } }
    #bar-joserfc { animation: fill-joserfc 13.757s linear infinite; }
    #badge-joserfc { animation: show-joserfc 13.757s step-end infinite; }
    @keyframes fill-joserfc { 0% { width: 0; } 25.152% { width: 390px; } 100% { width: 390px; } }
    @keyframes show-joserfc { 0% { opacity: 0; } 25.152% { opacity: 1; } 100% { opacity: 1; } }
    #bar-pyjwt { animation: fill-pyjwt 13.757s linear infinite; }
    #badge-pyjwt { animation: show-pyjwt 13.757s step-end infinite; }
    @keyframes fill-pyjwt { 0% { width: 0; } 44.734% { width: 390px; } 100% { width: 390px; } }
    @keyframes show-pyjwt { 0% { opacity: 0; } 44.734% { opacity: 1; } 100% { opacity: 1; } }
    #bar-jwcrypto { animation: fill-jwcrypto 13.757s linear infinite; }
    #badge-jwcrypto { animation: show-jwcrypto 13.757s step-end infinite; }
    @keyframes fill-jwcrypto { 0% { width: 0; } 78.194% { width: 390px; } 100% { width: 390px; } }
    @keyframes show-jwcrypto { 0% { opacity: 0; } 78.194% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes playhead {
      0% { transform: translateX(0); }
      78.194% { transform: translateX(390px); }
      100% { transform: translateX(390px); }
    }
  </style>

  <rect width="780" height="630" fill="#fcfcfb" />
  <text x="20" y="26" class="title">Decoding 100,000 HS256 tokens</text>

  <g>
    <line x1="250" y1="46" x2="640" y2="46" class="grid" />
    <line x1="250.0" y1="46" x2="250.0" y2="472" class="grid" />
    <text x="250.0" y="40" class="tick" text-anchor="middle">0.0s</text>
    <line x1="328.0" y1="46" x2="328.0" y2="472" class="grid" />
    <text x="328.0" y="40" class="tick" text-anchor="middle">2.2s</text>
    <line x1="406.0" y1="46" x2="406.0" y2="472" class="grid" />
    <text x="406.0" y="40" class="tick" text-anchor="middle">4.3s</text>
    <line x1="484.0" y1="46" x2="484.0" y2="472" class="grid" />
    <text x="484.0" y="40" class="tick" text-anchor="middle">6.5s</text>
    <line x1="562.0" y1="46" x2="562.0" y2="472" class="grid" />
    <text x="562.0" y="40" class="tick" text-anchor="middle">8.6s</text>
    <line x1="640.0" y1="46" x2="640.0" y2="472" class="grid" />
    <text x="640.0" y="40" class="tick" text-anchor="middle">10.8s</text>
    <g id="playhead">
      <line x1="250" y1="46" x2="250" y2="472" class="playhead" />
    </g>
  </g>

  <g>
    <rect x="250" y="58" width="390" height="26" rx="4" class="track" />
    <rect id="bar-ryjwt-msgspec" x="250" y="58" width="0" height="26" rx="4" fill="#009e00" />
    <rect x="20" y="71.0" width="10" height="10" rx="2" fill="#009e00" />
    <text x="36" y="73.0" class="name">ryjwt → Struct (Python)</text>
    <text x="36" y="86.0" class="rate">455,690 decodes/s</text>
    <g id="badge-ryjwt-msgspec" opacity="0">
      <text x="650" y="80.0" class="badge" fill="#009e00">&#x2713; 0.22s <tspan class="speedup">~28&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="250" y="100" width="390" height="26" rx="4" class="track" />
    <rect id="bar-ryjwt" x="250" y="100" width="0" height="26" rx="4" fill="#00c200" />
    <rect x="20" y="113.0" width="10" height="10" rx="2" fill="#00c200" />
    <text x="36" y="115.0" class="name">ryjwt → dict (Python)</text>
    <text x="36" y="128.0" class="rate">416,921 decodes/s</text>
    <g id="badge-ryjwt" opacity="0">
      <text x="650" y="122.0" class="badge" fill="#00c200">&#x2713; 0.24s <tspan class="speedup">~26&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="250" y="142" width="390" height="26" rx="4" class="track" />
    <rect id="bar-ryjwt-pydantic" x="250" y="142" width="0" height="26" rx="4" fill="#007a00" />
    <rect x="20" y="155.0" width="10" height="10" rx="2" fill="#007a00" />
    <text x="36" y="157.0" class="name">ryjwt → BaseModel (Python)†</text>
    <text x="36" y="170.0" class="rate">216,047 decodes/s</text>
    <g id="badge-ryjwt-pydantic" opacity="0">
      <text x="650" y="164.0" class="badge" fill="#007a00">&#x2713; 0.46s <tspan class="speedup">~13&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="250" y="184" width="390" height="26" rx="4" class="track" />
    <rect id="bar-jsonwebtoken" x="250" y="184" width="0" height="26" rx="4" fill="#eb6834" />
    <rect x="20" y="197.0" width="10" height="10" rx="2" fill="#eb6834" />
    <text x="36" y="199.0" class="name">jsonwebtoken (Rust)*</text>
    <text x="36" y="212.0" class="rate">192,604 decodes/s</text>
    <g id="badge-jsonwebtoken" opacity="0">
      <text x="650" y="206.0" class="badge" fill="#eb6834">&#x2713; 0.52s <tspan class="speedup">~12&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="250" y="226" width="390" height="26" rx="4" class="track" />
    <rect id="bar-fast-jwt" x="250" y="226" width="0" height="26" rx="4" fill="#4a3aa7" />
    <rect x="20" y="239.0" width="10" height="10" rx="2" fill="#4a3aa7" />
    <text x="36" y="241.0" class="name">fast-jwt (Bun)</text>
    <text x="36" y="254.0" class="rate">159,744 decodes/s</text>
    <g id="badge-fast-jwt" opacity="0">
      <text x="650" y="248.0" class="badge" fill="#4a3aa7">&#x2713; 0.63s <tspan class="speedup">~9.8&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="250" y="268" width="390" height="26" rx="4" class="track" />
    <rect id="bar-jose" x="250" y="268" width="0" height="26" rx="4" fill="#eda100" />
    <rect x="20" y="281.0" width="10" height="10" rx="2" fill="#eda100" />
    <text x="36" y="283.0" class="name">jose (Bun)</text>
    <text x="36" y="296.0" class="rate">48,351 decodes/s</text>
    <g id="badge-jose" opacity="0">
      <text x="650" y="290.0" class="badge" fill="#eda100">&#x2713; 2.07s <tspan class="speedup">~3.0&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="250" y="310" width="390" height="26" rx="4" class="track" />
    <rect id="bar-python-jose" x="250" y="310" width="0" height="26" rx="4" fill="#c2378e" />
    <rect x="20" y="323.0" width="10" height="10" rx="2" fill="#c2378e" />
    <text x="36" y="325.0" class="name">python-jose (Python)</text>
    <text x="36" y="338.0" class="rate">33,853 decodes/s</text>
    <g id="badge-python-jose" opacity="0">
      <text x="650" y="332.0" class="badge" fill="#c2378e">&#x2713; 2.95s <tspan class="speedup">~2.1&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="250" y="352" width="390" height="26" rx="4" class="track" />
    <rect id="bar-joserfc" x="250" y="352" width="0" height="26" rx="4" fill="#8a5a2b" />
    <rect x="20" y="365.0" width="10" height="10" rx="2" fill="#8a5a2b" />
    <text x="36" y="367.0" class="name">joserfc (Python)</text>
    <text x="36" y="380.0" class="rate">28,899 decodes/s</text>
    <g id="badge-joserfc" opacity="0">
      <text x="650" y="374.0" class="badge" fill="#8a5a2b">&#x2713; 3.46s <tspan class="speedup">~1.8&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="250" y="394" width="390" height="26" rx="4" class="track" />
    <rect id="bar-pyjwt" x="250" y="394" width="0" height="26" rx="4" fill="#2a78d6" />
    <rect x="20" y="407.0" width="10" height="10" rx="2" fill="#2a78d6" />
    <text x="36" y="409.0" class="name">PyJWT (Python)</text>
    <text x="36" y="422.0" class="rate">16,249 decodes/s</text>
    <g id="badge-pyjwt" opacity="0">
      <text x="650" y="416.0" class="badge" fill="#2a78d6">&#x2713; 6.15s <tspan class="speedup"></tspan></text>
    </g>
  </g>
  <g>
    <rect x="250" y="436" width="390" height="26" rx="4" class="track" />
    <rect id="bar-jwcrypto" x="250" y="436" width="0" height="26" rx="4" fill="#5f6b7a" />
    <rect x="20" y="449.0" width="10" height="10" rx="2" fill="#5f6b7a" />
    <text x="36" y="451.0" class="name">jwcrypto (Python)</text>
    <text x="36" y="464.0" class="rate">9,296 decodes/s</text>
    <g id="badge-jwcrypto" opacity="0">
      <text x="650" y="458.0" class="badge" fill="#5f6b7a">&#x2713; 10.76s <tspan class="speedup">~0.6&#215;</tspan></text>
    </g>
  </g>

  <text x="20" y="498" class="caption">HS256 with a 64-byte secret, a typical 661-byte token. Each bar takes 100,000 &#215; the library's mean time per decode.</text>
  <text x="20" y="514" class="caption">Measured in Docker, one container per library, each on one pinned CPU core.</text>
  <text x="20" y="530" class="caption">~N&#215;: how many times faster than PyJWT.</text>
  <text x="20" y="546" class="caption">* Same token, checks and crypto library (aws-lc) on both sides. Per token, jsonwebtoken 11 parses the header</text>
  <text x="20" y="562" class="caption">twice, re-keys the HMAC and deserialises the claims twice; ryjwt keys the HMAC once, parses the payload once</text>
  <text x="20" y="578" class="caption">and skips headers it has already verified. jsonwebtoken decodes into a serde_json::Value here.</text>
  <text x="20" y="594" class="caption">† Into a pydantic BaseModel, pydantic parses and validates the claims itself, which takes about twice as long</text>
  <text x="20" y="610" class="caption">as msgspec. ryjwt checks exp and aud first, before any of the model's code runs.</text>
</svg>
