# Fuzzes ryjwt (task fuzz: cargo-fuzz, libFuzzer with AddressSanitizer on nightly Rust; see
# docs/development.md) twice a week and on demand, never on pull requests: each target in a job of
# its own, for FUZZ_TIME seconds. Each target's corpus is cached for its next run to grow. A crash
# fails the job, and only the sanitizer's one-line summary is shown: the input may be an exploit for
# a vulnerability (SECURITY.md), and a public repository's logs and artifacts are public, while
# libFuzzer prints small inputs and the harness's checks quote what they compared. So the full log
# stays on the runner: find the failure again locally with task fuzz -- <target>.
name: Fuzz

on:
  schedule:
    # Twice a week: GitHub evicts a cache unused for 7 days, which a weekly run cuts too close.
    - cron: "0 4 * * 1,4" # Mondays and Thursdays, 04:00 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to fuzz each target: a whole number of seconds, 1 to 3600"
        type: number
        default: 300

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2
  TASK_VERSION: 3.54.0
  UV_LOCKED: 1 # fail if uv.lock is out of date with pyproject.toml
  UV_PYTHON_PREFERENCE: only-managed # a uv-managed Python, whose libpython the targets embed
  UV_VERSION: 0.13.0 # as ci.yml

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [decode, claims, encode, jwks, keys] # fuzz/Cargo.toml's [[bin]]s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # task fuzz installs the nightly Rust it pins.
      - name: Install cargo-fuzz
        run: cargo install --locked "cargo-fuzz@${CARGO_FUZZ_VERSION}"
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_ASKED: ${{ inputs.seconds || 300 }}
        run: |
          case "$SECONDS_ASKED" in
            "" | *[!0-9]* | ?????*) seconds=0 ;; # not digits, or too many for bash to add up
            *) seconds=$(( 10#$SECONDS_ASKED )) ;;
          esac
          if [ "$seconds" -lt 1 ] || [ "$seconds" -gt 3600 ]; then
            echo "::error::seconds must be a whole number from 1 to 3600"
            exit 1
          fi
          export FUZZ_TIME="$seconds"
          if ! task fuzz -- "$TARGET" > fuzz.log 2>&1; then
            grep -E '^SUMMARY: ' fuzz.log || echo "No sanitizer summary: a panic or a failed check."
            echo "::error::Fuzzing $TARGET failed. Reproduce it locally (task fuzz -- $TARGET), and treat it as a possible vulnerability (SECURITY.md)."
            exit 1
          fi
          grep -E '^(Done |stat::)' fuzz.log
      - name: Save the corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
