# Fuzzes ryjwt (task fuzz: cargo-fuzz, libFuzzer with AddressSanitizer on nightly Rust; see
# docs/development.md) twice a week and on demand, never on pull requests: each target in a job of
# its own, for FUZZ_TIME seconds. Each target's corpus is minimised and cached for its next run.
# Building is shown in full, but fuzzing isn't: a crash fails the job showing only libFuzzer's
# one-line summary and its seed. The input may be an exploit for a vulnerability (SECURITY.md), and
# a public repository's logs and artifacts are public, while libFuzzer prints small inputs and the
# harness's checks quote what they compared. The seed and the corpus the run started from reproduce
# it: FUZZ_SEED=<seed> task fuzz -- <target>.
name: Fuzz

on:
  schedule:
    # Twice a week: GitHub evicts a cache unused for 7 days, which a weekly run cuts too close.
    - cron: "0 4 * * 1,4" # Mondays and Thursdays, 04:00 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to fuzz each target: a whole number of seconds, 1 to 3600"
        type: number
        default: 300

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2
  TASK_VERSION: 3.54.0
  UV_LOCKED: 1 # fail if uv.lock is out of date with pyproject.toml
  UV_PYTHON_PREFERENCE: only-managed # a uv-managed Python, whose libpython the targets embed
  UV_VERSION: 0.13.0 # as ci.yml

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [decode, claims, encode, jwks, keys] # fuzz/Cargo.toml's [[bin]]s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # task fuzz-build installs the nightly Rust it pins, to build the targets with.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
          # Taskfile.yml pins the nightly the targets are built with, and fuzz/Cargo.lock is copied
          # from Cargo.lock, which rust-cache can't see as it restores.
          key: ${{ hashFiles('Taskfile.yml', 'Cargo.lock') }}
      - name: Restore the corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Build the fuzz targets
        id: build
        run: task fuzz-build
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          # 300 for the schedule; what was asked otherwise, which the step checks (0 too).
          SECONDS_ASKED: ${{ github.event_name == 'schedule' && 300 || inputs.seconds }}
          CORPUS: ${{ steps.corpus.outputs.cache-matched-key }}
        run: |
          case "$SECONDS_ASKED" in
            "" | *[!0-9]* | ?????*) seconds=0 ;; # not digits, or too many for bash to add up
            *) seconds=$(( 10#$SECONDS_ASKED )) ;;
          esac
          if [ "$seconds" -lt 1 ] || [ "$seconds" -gt 3600 ]; then
            echo "::error::seconds must be a whole number from 1 to 3600"
            exit 1
          fi
          export FUZZ_TIME="$seconds" FUZZ_BUILT=1
          if task fuzz -- "$TARGET" > fuzz.log 2>&1; then
            grep -E '^(Done |stat::)' fuzz.log || true
          elif grep -E '^SUMMARY: ' fuzz.log; then
            grep -m 1 -E '^INFO: Seed: ' fuzz.log || true
            echo "::error::Fuzzing $TARGET failed on an input, which isn't shown: treat it as a" \
              "possible vulnerability (SECURITY.md). The seed above and the corpus this run" \
              "started from (${CORPUS:-the seeds alone: no cache}) reproduce it:" \
              "FUZZ_SEED=<seed> task fuzz -- $TARGET."
            exit 1
          else
            # No libFuzzer summary, so not on an input: the harness or its environment. Its
            # progress lines are left out: they may quote dictionary entries taken from inputs.
            { grep -vE '^#[0-9]+[[:space:]]' fuzz.log || true; } | tail -n 40
            echo "::error::Fuzzing $TARGET failed, not on an input: see why above, or run" \
              "task fuzz -- $TARGET."
            exit 1
          fi
      # One pass over the corpus: at most a minute and a half (15,000 inputs), less once minimised.
      - name: Minimise the corpus
        id: cmin
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if ! task fuzz-cmin -- "$TARGET" > cmin.log 2>&1; then
            echo "::error::Minimising the $TARGET corpus failed: run task fuzz-cmin -- $TARGET."
            exit 1
          fi
          grep -E '^MERGE-OUTER: [0-9]+ new files' cmin.log || true
      - name: Save the corpus
        if: ${{ !cancelled() && steps.cmin.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
