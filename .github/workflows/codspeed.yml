# Runs the CodSpeed benchmarks (benchmarks/, as `task bench-codspeed` does locally) with
# pytest-codspeed, under CodSpeed's CPU simulation instrument, and uploads the results to CodSpeed
# (https://app.codspeed.io/RogerThomas/ryjwt), which reports any change on pull requests.
# The extension is built (release profile) before the measured step, so only the benchmarks run
# under the instrument. Authenticates with OpenID Connect: no token secret needed.
name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger runs on past commits, to backfill performance data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  UV_LOCKED: 1 # fail if uv.lock is out of date with pyproject.toml
  UV_VERSION: 0.13.0 # as ci.yml

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build ryjwt and the benchmark environment
        run: uv sync --group codspeed
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: uv run --no-sync pytest benchmarks --codspeed
