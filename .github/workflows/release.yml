# Releases with Release Please (release-please-config.json): on every push to main it opens or
# updates a release PR (the next version, from the Conventional Commits since the last release, and
# CHANGELOG.md); merging that PR tags the release and creates the GitHub release, and the same run
# then builds, tests and publishes it. (A tag made with the workflow's own token can't trigger
# another workflow, and PyPI trusts this file by name, so it all happens here.)
#
# Builds the wheels and the sdist, each uploaded with its SHA-256 as soon as it's built, one job per
# runner image; tests them in the same job (.github/scripts/test-wheel.sh), each wheel on the Python
# it's for; and when a release was created, once every build and test passed, publishes them all to
# PyPI, checking first that each SHA-256 still matches: what's published is exactly what was tested.
# Once they're published, it builds the documentation site (zensical.toml) and deploys it to GitHub
# Pages. Pull requests and manual runs build and test only; a manual run with `docs-only` instead
# deploys just the docs, as they are on the branch it runs on, without building or publishing.
#
# Each platform's job builds (and tests) a wheel per supported Python: cp312, cp313, cp314 and
# cp315, and the free-threaded cp314t and cp315t. Not abi3: the extension uses CPython APIs outside
# the limited API (e.g. PyO3's PyDelta accessors), jiter's fast string path needs them, and an abi3
# wheel doesn't load on a free-threaded Python anyway.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      docs-only:
        description: "Only build and deploy the docs to GitHub Pages (no wheels, nothing published to PyPI)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "Cargo.*"
      - "src/**"
      - "python/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "rust-toolchain.toml"
      - ".github/scripts/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  MATURIN_VERSION: v1.15.0
  UV_VERSION: 0.13.0 # as bench/docker/python.Dockerfile

jobs:
  release-please:
    name: Release PR or release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release, its tag and the release PR's branch
      pull-requests: write # the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One job per runner image: it builds that image's wheels, uploads each (with its SHA-256) as soon
  # as it's built, then tests them there. Few jobs, as an account runs at most 20 at once (5 on
  # macOS), shared with every other run and repo, and each job's setup and queue cost more than
  # most of its steps. A step runs even if one before it failed, so one run reports every failure;
  # a wheel is tested only if it built.
  linux:
    name: Linux ${{ matrix.arch }}
    needs: release-please
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' && !inputs.docs-only &&
      (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Each on a runner of its own architecture (no emulation). The images are the ones
        # maturin-action picks for each, pinned. The manylinux ones hold every CPython (cp315-cp315t
        # included); for musl, maturin cross-compiles with its own sysconfig data.
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            manylinux-container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae # latest
            musllinux-container: ghcr.io/rust-cross/rust-musl-cross@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a # x86_64-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            manylinux-container: quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6 # latest
            musllinux-container: ghcr.io/rust-cross/rust-musl-cross@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643 # aarch64-musl
    env:
      ALPINE_PYTHON_312: python@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4 # 3.12.15-alpine
      ALPINE_PYTHON_313: python@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a # 3.13.16-alpine
      ALPINE_PYTHON_314: python@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72 # 3.14.8-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no caches in a workflow that publishes

      # First: the builds below run as root in containers, and leave dist/ root-owned.
      - name: Build sdist
        id: sdist
        if: matrix.arch == 'x86_64'
        run: uv build --sdist --out-dir dist/sdist
      - name: Record the sdist SHA-256
        if: ${{ !cancelled() && steps.sdist.outcome == 'success' }}
        run: sh .github/scripts/sha256.sh record dist/sdist/*.tar.gz
      - if: ${{ !cancelled() && steps.sdist.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/sdist/
          if-no-files-found: error

      - name: Build manylinux
        id: manylinux
        if: ${{ !cancelled() }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.arch }}-unknown-linux-gnu
          manylinux: "2_28"
          container: ${{ matrix.manylinux-container }}
          # Caches compiled crates between runs, on pull requests only: no caches in a build that
          # may be published.
          sccache: ${{ github.event_name == 'pull_request' }}
          # Listed rather than --find-interpreter, which would also take the images' PyPy.
          args: >-
            --release --out dist/manylinux --interpreter
            python3.12 python3.13 python3.14 python3.14t python3.15 python3.15t
      - name: Record the manylinux SHA-256s
        if: ${{ !cancelled() && steps.manylinux.outcome == 'success' }}
        run: sh .github/scripts/sha256.sh record dist/manylinux/*.whl
      - if: ${{ !cancelled() && steps.manylinux.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}-unknown-linux-gnu
          path: dist/manylinux/
          if-no-files-found: error

      - name: Build musllinux
        id: musllinux
        if: ${{ !cancelled() }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.arch }}-unknown-linux-musl
          manylinux: musllinux_1_2
          container: ${{ matrix.musllinux-container }}
          sccache: ${{ github.event_name == 'pull_request' }} # as manylinux
          args: >-
            --release --out dist/musllinux --interpreter
            python3.12 python3.13 python3.14 python3.14t python3.15 python3.15t
      - name: Record the musllinux SHA-256s
        if: ${{ !cancelled() && steps.musllinux.outcome == 'success' }}
        run: sh .github/scripts/sha256.sh record dist/musllinux/*.whl
      - if: ${{ !cancelled() && steps.musllinux.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}-unknown-linux-musl
          path: dist/musllinux/
          if-no-files-found: error

      # The tests on the runner itself first: the Alpine ones, last, leave root-owned files.
      - name: Test manylinux
        if: ${{ !cancelled() && steps.manylinux.outcome == 'success' }}
        # On the Pythons uv downloads (python-build-standalone's).
        env:
          UV_PYTHON_PREFERENCE: only-managed # not the runner's own python3.12 (an old patch release)
        run: sh .github/scripts/test-wheel.sh dist/manylinux 3.12 3.13 3.14 3.14t 3.15 3.15t
      # From the sdist alone: which fails if the sdist is missing a file.
      - name: Test sdist
        if: ${{ !cancelled() && steps.sdist.outcome == 'success' }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          uv build --python 3.14 --wheel --out-dir dist/from-sdist dist/sdist/*.tar.gz
          sh .github/scripts/test-wheel.sh dist/from-sdist 3.14
      - name: Test musllinux (in Alpine)
        if: ${{ !cancelled() && steps.musllinux.outcome == 'success' }}
        # Each on the Python of an Alpine image of its version; 3.14t, 3.15 and 3.15t on ones uv
        # downloads, in the 3.14 image (there's no free-threaded image, and no 3.15.0 one yet: switch
        # 3.15 to it, pinned like these, once it's out). Node for pyright, which
        # tests/test_typing_errors.py runs. The wheels are mounted read-only. First, the venvs the
        # tests above made, for glibc Pythons, which test-wheel.sh would otherwise reuse.
        run: |
          rm -rf .venv-*
          for python in 3.12 3.13 3.14 3.14t 3.15 3.15t; do
            case $python in
              3.12) image=$ALPINE_PYTHON_312 ;;
              3.13) image=$ALPINE_PYTHON_313 ;;
              *) image=$ALPINE_PYTHON_314 ;;
            esac
            docker run --rm --volume "$PWD:/io" --volume "$PWD/dist/musllinux:/io/dist/musllinux:ro" \
              --workdir /io --env UV_VERSION --env UV_PYTHON_PREFERENCE=system --env PYTHON="$python" \
              "$image" sh -euxc '
                apk add --no-cache nodejs
                pip install --root-user-action=ignore --disable-pip-version-check "uv==$UV_VERSION"
                sh .github/scripts/test-wheel.sh dist/musllinux "$PYTHON"
              '
          done

  macos-windows:
    name: ${{ matrix.name }}
    needs: release-please
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' && !inputs.docs-only &&
      (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Each wheel built and tested on its own architecture: an arm64 runner can't test the x86_64
        # wheels under Rosetta, as cryptography (which the tests use) has no x86_64 macOS wheels and
        # can't be built for x86_64 there. So the slow Intel runner builds its own.
        include:
          - { name: macOS arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { name: macOS x86_64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { name: Windows x64, runner: windows-2025, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A wheel for each of these Pythons, which maturin is given by path.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python312
        with:
          python-version: "3.12"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python313
        with:
          python-version: "3.13"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python314
        with:
          python-version: "3.14"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python314t
        with:
          python-version: "3.14t"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python315
        with:
          python-version: "3.15"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python315t
        with:
          python-version: "3.15t"
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          # As the Linux builds: pull requests only.
          sccache: ${{ github.event_name == 'pull_request' }}
          args: >-
            --release --out dist --interpreter
            ${{ steps.python312.outputs.python-path }}
            ${{ steps.python313.outputs.python-path }}
            ${{ steps.python314.outputs.python-path }}
            ${{ steps.python314t.outputs.python-path }}
            ${{ steps.python315.outputs.python-path }}
            ${{ steps.python315t.outputs.python-path }}
      - name: Record the SHA-256
        run: sh .github/scripts/sha256.sh record dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no caches in a workflow that publishes
      - name: Test
        # On the Pythons uv downloads (python-build-standalone's), as on Linux: with setup-python's,
        # a request for 3.14 could find its free-threaded 3.14t, which can't load a cp314 wheel.
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: sh .github/scripts/test-wheel.sh dist 3.12 3.13 3.14 3.14t 3.15 3.15t

  publish:
    name: Publish to PyPI
    if: needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
      - linux
      - macos-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/ryjwt/
    permissions:
      id-token: write # PyPI trusted publishing
    outputs:
      python_version: ${{ steps.version.outputs.python_version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check every file is what was built and tested
        working-directory: dist
        run: |
          ls -l
          for file in *.whl *.tar.gz; do
            test -f "$file.sha256" || { echo "::error::No SHA-256 recorded for $file"; exit 1; }
          done
          sha256sum --check --strict -- *.sha256
          mkdir ../checksums
          mv -- *.sha256 ../checksums/ # only the distributions are uploaded
      - name: Check the release's version is the version built
        id: version
        env:
          VERSION: ${{ needs.release-please.outputs.version }} # semver, e.g. 0.1.0 or 0.2.0-beta.0
        run: |
          # The sdist is named with the PEP 440 form maturin makes of it (0.2.0b0 for 0.2.0-beta.0).
          python_version=$(printf '%s' "$VERSION" | sed -E 's/-alpha\.?/a/; s/-beta\.?/b/; s/-rc\.?/rc/')
          test -f "dist/ryjwt-${python_version}.tar.gz" \
            || { echo "::error::Release ${VERSION} doesn't match the version built (from Cargo.toml)"; exit 1; }
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  link-pypi:
    name: Link the release to PyPI
    needs:
      - release-please
      - publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # edit the release's notes
    steps:
      - name: Add the PyPI link to the release's notes
        # At the top of the notes Release Please wrote; once, should the job be re-run.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.publish.outputs.python_version }}
        run: |
          url="https://pypi.org/project/ryjwt/$VERSION/"
          notes=$(gh release view "$TAG" --json body --jq .body)
          case $notes in *"$url"*) exit 0 ;; esac
          printf 'Install from [PyPI](%s): `uv add ryjwt==%s`\n\n%s\n' "$url" "$VERSION" "$notes" > notes.md
          gh release edit "$TAG" --notes-file notes.md

  docs:
    name: Deploy the docs
    needs:
      - release-please
      - publish
    # After a release is published, or on a manual run with docs-only (publish is then skipped).
    if: >-
      ${{ !cancelled() && (needs.publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.docs-only)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read # check out the repository
      pages: write # deploy to GitHub Pages
      id-token: write # prove to GitHub Pages that the deployment comes from this workflow
    concurrency:
      group: github-pages # one deployment at a time, none cancelled midway
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no caches in a workflow that publishes
      # As `task docs-test` (CI's Docs job) builds it; the API reference needs no extension built.
      - name: Build
        run: uv run --locked --only-group docs zensical build --strict --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
