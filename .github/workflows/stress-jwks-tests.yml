# Temporary: runs tests/test_jwks_client.py 10 times in a row on the slowest runners, to check its
# timing holds. Removed before merging.
name: Stress the JWKS client tests

on:
  push:
    branches: [jwks-tests-fake-clock]

permissions:
  contents: read

env:
  UV_VERSION: 0.12.23

jobs:
  stress:
    name: Stress (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, python: "3.14t" }
          - { os: macos-15-intel, python: "3.14" }
          - { os: windows-2025, python: "3.14t" }
          - { os: ubuntu-24.04, python: "3.14t" }
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        run: uv sync --locked
      - name: Run the JWKS client tests 10 times
        shell: bash
        run: |
          for i in $(seq 10); do
            echo "::group::Run $i"
            uv run --no-sync pytest tests/test_jwks_client.py -q
            echo "::endgroup::"
          done
