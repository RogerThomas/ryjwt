# Runs the Taskfile tasks developers run locally (task lint, task typecheck, task test, task
# docs-test, task licenses, task coverage), so the two can't drift. uv takes Python from
# .python-version (or the test job's UV_PYTHON) and rustup takes Rust from rust-toolchain.toml.
# Lint and type-check run once, on .python-version's Python: the type checkers target 3.12
# (pyproject.toml), so they catch any use of a newer API.
#
# Few jobs: an account runs at most 20 jobs at once (5 on macOS), shared with every other run and
# repo, and a job's setup takes about as long as the checks it then runs. So the quick checks share
# one job, and the tests run on Linux only: on macOS and Windows, the Release workflow tests the
# wheels it builds, on every supported Python, for every pull request that changes the code.
#
# The ruleset need only require "CI passed", which fails unless every other job passed: jobs can
# then be added, renamed or merged without changing the ruleset.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TASK_VERSION: 3.54.0
  UV_LOCKED: 1 # fail if uv.lock is out of date with pyproject.toml
  UV_VERSION: 0.13.0 # as bench/docker/python.Dockerfile

jobs:
  # Each check a step of its own, run even if one before it failed, so one run reports them all.
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.2
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Lint
        run: task lint
      - name: Type-check
        if: ${{ !cancelled() }}
        run: task typecheck
      # The examples in the docs run in the test job, as tests/test_docs.py.
      - name: Docs
        if: ${{ !cancelled() }}
        run: task docs-test
      - name: Third-party licenses
        if: ${{ !cancelled() }}
        run: |
          task licenses
          git diff --exit-code -- THIRD_PARTY_LICENSES \
            || { echo "::error file=THIRD_PARTY_LICENSES::Out of date with Cargo.lock: run task licenses and commit it"; exit 1; }

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Every supported version, and the free-threaded builds. (macOS and Windows: see the top.)
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: ubuntu-24.04, python: "3.14t" }
          - { os: ubuntu-24.04, python: "3.15" }
          - { os: ubuntu-24.04, python: "3.15t" }
    env:
      UV_PYTHON: ${{ matrix.python }} # instead of .python-version's; uv downloads it if need be
      UV_PYTHON_PREFERENCE: only-managed # the latest patch release, not the runner's own Python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: task test

  # Once, on Linux and .python-version's Python: what the tests cover doesn't depend on the
  # platform. task coverage measures the Python (pytest-cov) and the Rust (cargo-llvm-cov, the
  # extension built instrumented); each is uploaded to Codecov under a flag of its own (codecov.yml).
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with Codecov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Rust (rust-toolchain.toml) and llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: task coverage
      # A pull request from a fork gets no OpenID Connect token; Codecov takes its upload tokenless.
      - name: Upload Python coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/python.xml
          disable_search: true
          flags: python
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          fail_ci_if_error: true
      - name: Upload Rust coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/rust.lcov
          disable_search: true
          flags: rust
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          fail_ci_if_error: true

  ci-passed:
    name: CI passed
    if: always()
    needs: [checks, test, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::A required job ended with: $result"; exit 1; }
          done
