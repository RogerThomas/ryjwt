# Runs the Taskfile tasks developers run locally (task lint, task typecheck, task test, task
# docs-test), so the two
# can't drift. uv takes Python from .python-version (or the test job's UV_PYTHON) and rustup takes
# Rust from rust-toolchain.toml. Lint and type-check run once, on 3.14: the type checkers target
# 3.12 (pyproject.toml), so they catch any use of a newer API.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TASK_VERSION: 3.54.0
  UV_LOCKED: 1 # fail if uv.lock is out of date with pyproject.toml
  UV_VERSION: 0.12.23 # as bench/docker/python.Dockerfile

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: task lint

  typecheck:
    name: Type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: task typecheck

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Every supported version (and the free-threaded build) on Linux; the oldest and newest on
        # macOS and Windows, where what differs is the platform, not the Python version.
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: ubuntu-24.04, python: "3.14t" }
          - { os: macos-15, python: "3.12" }
          - { os: macos-15, python: "3.14" }
          - { os: windows-2025, python: "3.12" }
          - { os: windows-2025, python: "3.14" }
    env:
      UV_PYTHON: ${{ matrix.python }} # instead of .python-version's; uv downloads it if need be
      UV_PYTHON_PREFERENCE: only-managed # the latest patch release, not the runner's own Python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: task test

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # No Rust: the API reference reads the sources statically, without building the extension.
      # (The examples in the docs run in the test job, as tests/test_docs.py.)
      - run: task docs-test

  licenses:
    name: Third-party licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about@0.9.2
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - run: task licenses
      - name: Check THIRD_PARTY_LICENSES is up to date
        run: |
          git diff --exit-code -- THIRD_PARTY_LICENSES \
            || { echo "::error file=THIRD_PARTY_LICENSES::Out of date with Cargo.lock: run task licenses and commit it"; exit 1; }
