# Runs the Taskfile tasks developers run locally (task lint, task typecheck, task test, task
# docs-test, task licenses, task coverage), so the two can't drift. uv takes Python from
# .python-version (or a test step's UV_PYTHON) and rustup takes Rust from rust-toolchain.toml.
# Lint and type-check run once, on .python-version's Python: the type checkers target 3.12
# (pyproject.toml), so they catch any use of a newer API.
#
# One job: an account runs at most 20 jobs at once (5 on macOS), shared with every other run and
# repo, and a job's setup and time queued cost more than most of its steps. Each check and each
# Python's tests is a step of its own, run even if one before it failed, so one run reports every
# failure. The tests run on Linux only: on macOS and Windows, the Release workflow tests the wheels
# it builds, on every supported Python, for every pull request that changes the code.
#
# The ruleset need only require "CI passed", which fails unless every other job passed: jobs can
# then be added, renamed or merged without changing the ruleset.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TASK_VERSION: 3.54.0
  UV_LOCKED: 1 # fail if uv.lock is out of date with pyproject.toml
  UV_VERSION: 0.13.0 # as bench/docker/python.Dockerfile

jobs:
  ci:
    name: Checks, tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with Codecov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.2,cargo-llvm-cov@0.9.1
      - name: Install Rust (rust-toolchain.toml) and llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint
        run: task lint
      - name: Type-check
        if: ${{ !cancelled() }}
        run: task typecheck
      # The examples in the docs run with the tests, as tests/test_docs.py.
      - name: Docs
        if: ${{ !cancelled() }}
        run: task docs-test
      - name: Third-party licenses
        if: ${{ !cancelled() }}
        run: |
          task licenses
          git diff --exit-code -- THIRD_PARTY_LICENSES \
            || { echo "::error file=THIRD_PARTY_LICENSES::Out of date with Cargo.lock: run task licenses and commit it"; exit 1; }

      # Every supported version, and the free-threaded builds, each in a venv of its own, on the
      # latest patch release uv downloads, not the runner's own Python. Not .python-version's
      # (3.14): the coverage step below runs the tests on it.
      - name: Test (Python 3.12)
        if: ${{ !cancelled() }}
        env: { UV_PYTHON: "3.12", UV_PROJECT_ENVIRONMENT: .venv-3.12, UV_PYTHON_PREFERENCE: only-managed }
        run: task test
      - name: Test (Python 3.13)
        if: ${{ !cancelled() }}
        env: { UV_PYTHON: "3.13", UV_PROJECT_ENVIRONMENT: .venv-3.13, UV_PYTHON_PREFERENCE: only-managed }
        run: task test
      - name: Test (Python 3.14t)
        if: ${{ !cancelled() }}
        env: { UV_PYTHON: "3.14t", UV_PROJECT_ENVIRONMENT: .venv-3.14t, UV_PYTHON_PREFERENCE: only-managed }
        run: task test
      - name: Test (Python 3.15)
        if: ${{ !cancelled() }}
        env: { UV_PYTHON: "3.15", UV_PROJECT_ENVIRONMENT: .venv-3.15, UV_PYTHON_PREFERENCE: only-managed }
        run: task test
      - name: Test (Python 3.15t)
        if: ${{ !cancelled() }}
        env: { UV_PYTHON: "3.15t", UV_PROJECT_ENVIRONMENT: .venv-3.15t, UV_PYTHON_PREFERENCE: only-managed }
        run: task test

      # The tests on .python-version's Python, measuring the coverage of the Python (pytest-cov) and
      # of the Rust (cargo-llvm-cov, the extension built instrumented); each is uploaded to Codecov
      # under a flag of its own (codecov.yml). What they cover doesn't depend on the platform.
      - name: Test with coverage (Python 3.14)
        id: coverage
        if: ${{ !cancelled() }}
        run: task coverage
      # A pull request from a fork gets no OpenID Connect token; Codecov takes its upload tokenless.
      - name: Upload Python coverage
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/python.xml
          disable_search: true
          flags: python
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          fail_ci_if_error: true
      - name: Upload Rust coverage
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/rust.lcov
          disable_search: true
          flags: rust
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          fail_ci_if_error: true

  ci-passed:
    name: CI passed
    if: always()
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::A required job ended with: $result"; exit 1; }
          done
