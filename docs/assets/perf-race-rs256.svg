<svg xmlns="http://www.w3.org/2000/svg" width="780" height="550" viewBox="0 0 780 550">
  <title>Decoding 100,000 RS256 tokens</title>
  <desc>10 JWT libraries each decode 100,000 tokens (RS256 with a 3072-bit RSA PEM public key, a typical 1131-byte token), the bars filling in real time. ryjwt → Struct (Python) finishes in 2.94s, PyJWT (Python) in 7.86s. Versions: ryjwt 0.2.2 → Struct, ryjwt 0.2.2 → dict (msgspec), ryjwt 0.2.2 → dict (jiter), ryjwt 0.2.2 → BaseModel, fast-jwt 6.3.3, jsonwebtoken 11.1.0 (aws-lc-rs) → struct, jsonwebtoken 11.1.0 (aws-lc-rs) → Value, jose 6.2.12, joserfc 1.7.5, pyjwt 2.15.1.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .title { font-size: 15px; fill: #0b0b0b; font-weight: 600; }
    .tick { font-size: 10px; fill: #898781; }
    .name { font-size: 13px; fill: #0b0b0b; font-weight: 600; }
    .rate { font-size: 10px; fill: #52514e; }
    .caption { font-size: 11px; fill: #52514e; }
    .badge { font-size: 12px; font-weight: 700; }
    .speedup { font-size: 11px; font-weight: 600; fill: #52514e; }
    .track { fill: #f3f2ef; stroke: #e1e0d9; }
    .grid { stroke: #e1e0d9; stroke-width: 1; }
    .playhead { stroke: #0b0b0b; stroke-width: 1.5; opacity: 0.55; }

    /* One 10.856s loop: the race runs for the first 72.366%
       (7.856s, the slowest library's time), then every bar holds
       for 3s, so the finish times can be read, before it restarts. */
    #playhead { animation: playhead 10.856s linear infinite; }
    #bar-ryjwt-msgspec { animation: fill-ryjwt-msgspec 10.856s linear infinite; }
    #badge-ryjwt-msgspec { animation: show-ryjwt-msgspec 10.856s step-end infinite; }
    @keyframes fill-ryjwt-msgspec { 0% { width: 0; } 27.079% { width: 360px; } 100% { width: 360px; } }
    @keyframes show-ryjwt-msgspec { 0% { opacity: 0; } 27.079% { opacity: 1; } 100% { opacity: 1; } }
    #bar-ryjwt { animation: fill-ryjwt 10.856s linear infinite; }
    #badge-ryjwt { animation: show-ryjwt 10.856s step-end infinite; }
    @keyframes fill-ryjwt { 0% { width: 0; } 27.150% { width: 360px; } 100% { width: 360px; } }
    @keyframes show-ryjwt { 0% { opacity: 0; } 27.150% { opacity: 1; } 100% { opacity: 1; } }
    #bar-ryjwt-jiter { animation: fill-ryjwt-jiter 10.856s linear infinite; }
    #badge-ryjwt-jiter { animation: show-ryjwt-jiter 10.856s step-end infinite; }
    @keyframes fill-ryjwt-jiter { 0% { width: 0; } 27.390% { width: 360px; } 100% { width: 360px; } }
    @keyframes show-ryjwt-jiter { 0% { opacity: 0; } 27.390% { opacity: 1; } 100% { opacity: 1; } }
    #bar-ryjwt-pydantic { animation: fill-ryjwt-pydantic 10.856s linear infinite; }
    #badge-ryjwt-pydantic { animation: show-ryjwt-pydantic 10.856s step-end infinite; }
    @keyframes fill-ryjwt-pydantic { 0% { width: 0; } 28.439% { width: 360px; } 100% { width: 360px; } }
    @keyframes show-ryjwt-pydantic { 0% { opacity: 0; } 28.439% { opacity: 1; } 100% { opacity: 1; } }
    #bar-fast-jwt { animation: fill-fast-jwt 10.856s linear infinite; }
    #badge-fast-jwt { animation: show-fast-jwt 10.856s step-end infinite; }
    @keyframes fill-fast-jwt { 0% { width: 0; } 31.656% { width: 360px; } 100% { width: 360px; } }
    @keyframes show-fast-jwt { 0% { opacity: 0; } 31.656% { opacity: 1; } 100% { opacity: 1; } }
    #bar-jsonwebtoken-struct { animation: fill-jsonwebtoken-struct 10.856s linear infinite; }
    #badge-jsonwebtoken-struct { animation: show-jsonwebtoken-struct 10.856s step-end infinite; }
    @keyframes fill-jsonwebtoken-struct { 0% { width: 0; } 32.642% { width: 360px; } 100% { width: 360px; } }
    @keyframes show-jsonwebtoken-struct { 0% { opacity: 0; } 32.642% { opacity: 1; } 100% { opacity: 1; } }
    #bar-jsonwebtoken { animation: fill-jsonwebtoken 10.856s linear infinite; }
    #badge-jsonwebtoken { animation: show-jsonwebtoken 10.856s step-end infinite; }
    @keyframes fill-jsonwebtoken { 0% { width: 0; } 33.137% { width: 360px; } 100% { width: 360px; } }
    @keyframes show-jsonwebtoken { 0% { opacity: 0; } 33.137% { opacity: 1; } 100% { opacity: 1; } }
    #bar-jose { animation: fill-jose 10.856s linear infinite; }
    #badge-jose { animation: show-jose 10.856s step-end infinite; }
    @keyframes fill-jose { 0% { width: 0; } 38.697% { width: 360px; } 100% { width: 360px; } }
    @keyframes show-jose { 0% { opacity: 0; } 38.697% { opacity: 1; } 100% { opacity: 1; } }
    #bar-joserfc { animation: fill-joserfc 10.856s linear infinite; }
    #badge-joserfc { animation: show-joserfc 10.856s step-end infinite; }
    @keyframes fill-joserfc { 0% { width: 0; } 48.459% { width: 360px; } 100% { width: 360px; } }
    @keyframes show-joserfc { 0% { opacity: 0; } 48.459% { opacity: 1; } 100% { opacity: 1; } }
    #bar-pyjwt { animation: fill-pyjwt 10.856s linear infinite; }
    #badge-pyjwt { animation: show-pyjwt 10.856s step-end infinite; }
    @keyframes fill-pyjwt { 0% { width: 0; } 72.366% { width: 360px; } 100% { width: 360px; } }
    @keyframes show-pyjwt { 0% { opacity: 0; } 72.366% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes playhead {
      0% { transform: translateX(0); }
      72.366% { transform: translateX(360px); }
      100% { transform: translateX(360px); }
    }
  </style>

  <rect width="780" height="550" fill="#fcfcfb" />
  <text x="20" y="26" class="title">Decoding 100,000 RS256 tokens</text>

  <g>
    <line x1="280" y1="46" x2="640" y2="46" class="grid" />
    <line x1="280.0" y1="46" x2="280.0" y2="472" class="grid" />
    <text x="280.0" y="40" class="tick" text-anchor="middle">0.0s</text>
    <line x1="352.0" y1="46" x2="352.0" y2="472" class="grid" />
    <text x="352.0" y="40" class="tick" text-anchor="middle">1.6s</text>
    <line x1="424.0" y1="46" x2="424.0" y2="472" class="grid" />
    <text x="424.0" y="40" class="tick" text-anchor="middle">3.1s</text>
    <line x1="496.0" y1="46" x2="496.0" y2="472" class="grid" />
    <text x="496.0" y="40" class="tick" text-anchor="middle">4.7s</text>
    <line x1="568.0" y1="46" x2="568.0" y2="472" class="grid" />
    <text x="568.0" y="40" class="tick" text-anchor="middle">6.3s</text>
    <line x1="640.0" y1="46" x2="640.0" y2="472" class="grid" />
    <text x="640.0" y="40" class="tick" text-anchor="middle">7.9s</text>
    <g id="playhead">
      <line x1="280" y1="46" x2="280" y2="472" class="playhead" />
    </g>
  </g>

  <g>
    <rect x="280" y="58" width="360" height="26" rx="4" class="track" />
    <rect id="bar-ryjwt-msgspec" x="280" y="58" width="0" height="26" rx="4" fill="#009e00" />
    <rect x="20" y="71.0" width="10" height="10" rx="2" fill="#009e00" />
    <text x="36" y="73.0" class="name">ryjwt → Struct (Python)</text>
    <text x="36" y="86.0" class="rate">34,015 decodes/s</text>
    <g id="badge-ryjwt-msgspec" opacity="0">
      <text x="650" y="80.0" class="badge" fill="#009e00">&#x2713; 2.94s <tspan class="speedup">~2.7&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="280" y="100" width="360" height="26" rx="4" class="track" />
    <rect id="bar-ryjwt" x="280" y="100" width="0" height="26" rx="4" fill="#00c200" />
    <rect x="20" y="113.0" width="10" height="10" rx="2" fill="#00c200" />
    <text x="36" y="115.0" class="name">ryjwt → dict (msgspec) (Python)</text>
    <text x="36" y="128.0" class="rate">33,928 decodes/s</text>
    <g id="badge-ryjwt" opacity="0">
      <text x="650" y="122.0" class="badge" fill="#00c200">&#x2713; 2.95s <tspan class="speedup">~2.7&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="280" y="142" width="360" height="26" rx="4" class="track" />
    <rect id="bar-ryjwt-jiter" x="280" y="142" width="0" height="26" rx="4" fill="#5fd35f" />
    <rect x="20" y="155.0" width="10" height="10" rx="2" fill="#5fd35f" />
    <text x="36" y="157.0" class="name">ryjwt → dict (jiter) (Python)</text>
    <text x="36" y="170.0" class="rate">33,630 decodes/s</text>
    <g id="badge-ryjwt-jiter" opacity="0">
      <text x="650" y="164.0" class="badge" fill="#5fd35f">&#x2713; 2.97s <tspan class="speedup">~2.6&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="280" y="184" width="360" height="26" rx="4" class="track" />
    <rect id="bar-ryjwt-pydantic" x="280" y="184" width="0" height="26" rx="4" fill="#007a00" />
    <rect x="20" y="197.0" width="10" height="10" rx="2" fill="#007a00" />
    <text x="36" y="199.0" class="name">ryjwt → BaseModel (Python)</text>
    <text x="36" y="212.0" class="rate">32,389 decodes/s</text>
    <g id="badge-ryjwt-pydantic" opacity="0">
      <text x="650" y="206.0" class="badge" fill="#007a00">&#x2713; 3.09s <tspan class="speedup">~2.5&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="280" y="226" width="360" height="26" rx="4" class="track" />
    <rect id="bar-fast-jwt" x="280" y="226" width="0" height="26" rx="4" fill="#4a3aa7" />
    <rect x="20" y="239.0" width="10" height="10" rx="2" fill="#4a3aa7" />
    <text x="36" y="241.0" class="name">fast-jwt (Bun)</text>
    <text x="36" y="254.0" class="rate">29,098 decodes/s</text>
    <g id="badge-fast-jwt" opacity="0">
      <text x="650" y="248.0" class="badge" fill="#4a3aa7">&#x2713; 3.44s <tspan class="speedup">~2.3&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="280" y="268" width="360" height="26" rx="4" class="track" />
    <rect id="bar-jsonwebtoken-struct" x="280" y="268" width="0" height="26" rx="4" fill="#eb6834" />
    <rect x="20" y="281.0" width="10" height="10" rx="2" fill="#eb6834" />
    <text x="36" y="283.0" class="name">jsonwebtoken → struct (Rust)</text>
    <text x="36" y="296.0" class="rate">28,219 decodes/s</text>
    <g id="badge-jsonwebtoken-struct" opacity="0">
      <text x="650" y="290.0" class="badge" fill="#eb6834">&#x2713; 3.54s <tspan class="speedup">~2.2&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="280" y="310" width="360" height="26" rx="4" class="track" />
    <rect id="bar-jsonwebtoken" x="280" y="310" width="0" height="26" rx="4" fill="#f4a582" />
    <rect x="20" y="323.0" width="10" height="10" rx="2" fill="#f4a582" />
    <text x="36" y="325.0" class="name">jsonwebtoken → Value (Rust)</text>
    <text x="36" y="338.0" class="rate">27,797 decodes/s</text>
    <g id="badge-jsonwebtoken" opacity="0">
      <text x="650" y="332.0" class="badge" fill="#f4a582">&#x2713; 3.60s <tspan class="speedup">~2.2&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="280" y="352" width="360" height="26" rx="4" class="track" />
    <rect id="bar-jose" x="280" y="352" width="0" height="26" rx="4" fill="#eda100" />
    <rect x="20" y="365.0" width="10" height="10" rx="2" fill="#eda100" />
    <text x="36" y="367.0" class="name">jose (Bun)</text>
    <text x="36" y="380.0" class="rate">23,803 decodes/s</text>
    <g id="badge-jose" opacity="0">
      <text x="650" y="374.0" class="badge" fill="#eda100">&#x2713; 4.20s <tspan class="speedup">~1.9&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="280" y="394" width="360" height="26" rx="4" class="track" />
    <rect id="bar-joserfc" x="280" y="394" width="0" height="26" rx="4" fill="#8a5a2b" />
    <rect x="20" y="407.0" width="10" height="10" rx="2" fill="#8a5a2b" />
    <text x="36" y="409.0" class="name">joserfc (Python)</text>
    <text x="36" y="422.0" class="rate">19,008 decodes/s</text>
    <g id="badge-joserfc" opacity="0">
      <text x="650" y="416.0" class="badge" fill="#8a5a2b">&#x2713; 5.26s <tspan class="speedup">~1.5&#215;</tspan></text>
    </g>
  </g>
  <g>
    <rect x="280" y="436" width="360" height="26" rx="4" class="track" />
    <rect id="bar-pyjwt" x="280" y="436" width="0" height="26" rx="4" fill="#2a78d6" />
    <rect x="20" y="449.0" width="10" height="10" rx="2" fill="#2a78d6" />
    <text x="36" y="451.0" class="name">PyJWT (Python)</text>
    <text x="36" y="464.0" class="rate">12,729 decodes/s</text>
    <g id="badge-pyjwt" opacity="0">
      <text x="650" y="458.0" class="badge" fill="#2a78d6">&#x2713; 7.86s <tspan class="speedup"></tspan></text>
    </g>
  </g>

  <text x="20" y="498" class="caption">RS256 with a 3072-bit RSA PEM public key, a typical 1131-byte token. Each bar takes the library's mean time for 100,000 decodes, over 3 rounds.</text>
  <text x="20" y="514" class="caption">Measured in Docker, one container per library, each on one pinned CPU.</text>
  <text x="20" y="530" class="caption">~N&#215;: how many times faster than PyJWT.</text>

</svg>
