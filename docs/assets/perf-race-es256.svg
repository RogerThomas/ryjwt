<svg xmlns="http://www.w3.org/2000/svg" width="780" height="534" viewBox="0 0 780 534">
  <title>Decoding 100,000 ES256 tokens</title>
  <desc>10 JWT libraries each decode 100,000 tokens (ES256 with a PEM public key, a typical 704-byte token), the bars filling in real time. ryjwt → Struct (Python) finishes in 3.21s, jwcrypto (Python) in 8.34s. Versions: ryjwt 0.0.0a0 → Struct, ryjwt 0.0.0a0 → dict, ryjwt 0.0.0a0 → BaseModel, jsonwebtoken 11.1.0 (aws-lc-rs), fast-jwt 6.3.3, jose 6.2.12, python-jose 3.5.0, joserfc 1.7.5, pyjwt 2.15.1, jwcrypto 1.6.1.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .title { font-size: 15px; fill: #0b0b0b; font-weight: 600; }
    .tick { font-size: 10px; fill: #898781; }
    .name { font-size: 13px; fill: #0b0b0b; font-weight: 600; }
    .rate { font-size: 10px; fill: #52514e; }
    .caption { font-size: 11px; fill: #52514e; }
    .badge { font-size: 12px; font-weight: 700; }
    .track { fill: #f3f2ef; stroke: #e1e0d9; }
    .grid { stroke: #e1e0d9; stroke-width: 1; }
    .playhead { stroke: #0b0b0b; stroke-width: 1.5; opacity: 0.55; }

    /* One 11.338s loop: the race runs for the first 73.541%
       (8.338s, the slowest library's time), then every bar holds
       for 3s, so the finish times can be read, before it restarts. */
    #playhead { animation: playhead 11.338s linear infinite; }
    #bar-ryjwt-msgspec { animation: fill-ryjwt-msgspec 11.338s linear infinite; }
    #badge-ryjwt-msgspec { animation: show-ryjwt-msgspec 11.338s step-end infinite; }
    @keyframes fill-ryjwt-msgspec { 0% { width: 0; } 28.291% { width: 447px; } 100% { width: 447px; } }
    @keyframes show-ryjwt-msgspec { 0% { opacity: 0; } 28.291% { opacity: 1; } 100% { opacity: 1; } }
    #bar-ryjwt { animation: fill-ryjwt 11.338s linear infinite; }
    #badge-ryjwt { animation: show-ryjwt 11.338s step-end infinite; }
    @keyframes fill-ryjwt { 0% { width: 0; } 28.383% { width: 447px; } 100% { width: 447px; } }
    @keyframes show-ryjwt { 0% { opacity: 0; } 28.383% { opacity: 1; } 100% { opacity: 1; } }
    #bar-ryjwt-pydantic { animation: fill-ryjwt-pydantic 11.338s linear infinite; }
    #badge-ryjwt-pydantic { animation: show-ryjwt-pydantic 11.338s step-end infinite; }
    @keyframes fill-ryjwt-pydantic { 0% { width: 0; } 29.520% { width: 447px; } 100% { width: 447px; } }
    @keyframes show-ryjwt-pydantic { 0% { opacity: 0; } 29.520% { opacity: 1; } 100% { opacity: 1; } }
    #bar-jsonwebtoken { animation: fill-jsonwebtoken 11.338s linear infinite; }
    #badge-jsonwebtoken { animation: show-jsonwebtoken 11.338s step-end infinite; }
    @keyframes fill-jsonwebtoken { 0% { width: 0; } 30.406% { width: 447px; } 100% { width: 447px; } }
    @keyframes show-jsonwebtoken { 0% { opacity: 0; } 30.406% { opacity: 1; } 100% { opacity: 1; } }
    #bar-fast-jwt { animation: fill-fast-jwt 11.338s linear infinite; }
    #badge-fast-jwt { animation: show-fast-jwt 11.338s step-end infinite; }
    @keyframes fill-fast-jwt { 0% { width: 0; } 31.294% { width: 447px; } 100% { width: 447px; } }
    @keyframes show-fast-jwt { 0% { opacity: 0; } 31.294% { opacity: 1; } 100% { opacity: 1; } }
    #bar-jose { animation: fill-jose 11.338s linear infinite; }
    #badge-jose { animation: show-jose 11.338s step-end infinite; }
    @keyframes fill-jose { 0% { width: 0; } 37.865% { width: 447px; } 100% { width: 447px; } }
    @keyframes show-jose { 0% { opacity: 0; } 37.865% { opacity: 1; } 100% { opacity: 1; } }
    #bar-python-jose { animation: fill-python-jose 11.338s linear infinite; }
    #badge-python-jose { animation: show-python-jose 11.338s step-end infinite; }
    @keyframes fill-python-jose { 0% { width: 0; } 47.997% { width: 447px; } 100% { width: 447px; } }
    @keyframes show-python-jose { 0% { opacity: 0; } 47.997% { opacity: 1; } 100% { opacity: 1; } }
    #bar-joserfc { animation: fill-joserfc 11.338s linear infinite; }
    #badge-joserfc { animation: show-joserfc 11.338s step-end infinite; }
    @keyframes fill-joserfc { 0% { width: 0; } 50.891% { width: 447px; } 100% { width: 447px; } }
    @keyframes show-joserfc { 0% { opacity: 0; } 50.891% { opacity: 1; } 100% { opacity: 1; } }
    #bar-pyjwt { animation: fill-pyjwt 11.338s linear infinite; }
    #badge-pyjwt { animation: show-pyjwt 11.338s step-end infinite; }
    @keyframes fill-pyjwt { 0% { width: 0; } 64.736% { width: 447px; } 100% { width: 447px; } }
    @keyframes show-pyjwt { 0% { opacity: 0; } 64.736% { opacity: 1; } 100% { opacity: 1; } }
    #bar-jwcrypto { animation: fill-jwcrypto 11.338s linear infinite; }
    #badge-jwcrypto { animation: show-jwcrypto 11.338s step-end infinite; }
    @keyframes fill-jwcrypto { 0% { width: 0; } 73.541% { width: 447px; } 100% { width: 447px; } }
    @keyframes show-jwcrypto { 0% { opacity: 0; } 73.541% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes playhead {
      0% { transform: translateX(0); }
      73.541% { transform: translateX(447px); }
      100% { transform: translateX(447px); }
    }
  </style>

  <rect width="780" height="534" fill="#fcfcfb" />
  <text x="20" y="26" class="title">Decoding 100,000 ES256 tokens</text>

  <g>
    <line x1="243" y1="46" x2="690" y2="46" class="grid" />
    <line x1="243.0" y1="46" x2="243.0" y2="472" class="grid" />
    <text x="243.0" y="40" class="tick" text-anchor="middle">0.0s</text>
    <line x1="332.4" y1="46" x2="332.4" y2="472" class="grid" />
    <text x="332.4" y="40" class="tick" text-anchor="middle">1.7s</text>
    <line x1="421.8" y1="46" x2="421.8" y2="472" class="grid" />
    <text x="421.8" y="40" class="tick" text-anchor="middle">3.3s</text>
    <line x1="511.2" y1="46" x2="511.2" y2="472" class="grid" />
    <text x="511.2" y="40" class="tick" text-anchor="middle">5.0s</text>
    <line x1="600.6" y1="46" x2="600.6" y2="472" class="grid" />
    <text x="600.6" y="40" class="tick" text-anchor="middle">6.7s</text>
    <line x1="690.0" y1="46" x2="690.0" y2="472" class="grid" />
    <text x="690.0" y="40" class="tick" text-anchor="middle">8.3s</text>
    <g id="playhead">
      <line x1="243" y1="46" x2="243" y2="472" class="playhead" />
    </g>
  </g>

  <g>
    <rect x="243" y="58" width="447" height="26" rx="4" class="track" />
    <rect id="bar-ryjwt-msgspec" x="243" y="58" width="0" height="26" rx="4" fill="#009e00" />
    <rect x="20" y="71.0" width="10" height="10" rx="2" fill="#009e00" />
    <text x="36" y="73.0" class="name">ryjwt → Struct (Python)</text>
    <text x="36" y="86.0" class="rate">31,175 decodes/s</text>
    <g id="badge-ryjwt-msgspec" opacity="0">
      <text x="700" y="80.0" class="badge" fill="#009e00">&#x2713; 3.21s</text>
    </g>
  </g>
  <g>
    <rect x="243" y="100" width="447" height="26" rx="4" class="track" />
    <rect id="bar-ryjwt" x="243" y="100" width="0" height="26" rx="4" fill="#00c200" />
    <rect x="20" y="113.0" width="10" height="10" rx="2" fill="#00c200" />
    <text x="36" y="115.0" class="name">ryjwt → dict (Python)</text>
    <text x="36" y="128.0" class="rate">31,074 decodes/s</text>
    <g id="badge-ryjwt" opacity="0">
      <text x="700" y="122.0" class="badge" fill="#00c200">&#x2713; 3.22s</text>
    </g>
  </g>
  <g>
    <rect x="243" y="142" width="447" height="26" rx="4" class="track" />
    <rect id="bar-ryjwt-pydantic" x="243" y="142" width="0" height="26" rx="4" fill="#007a00" />
    <rect x="20" y="155.0" width="10" height="10" rx="2" fill="#007a00" />
    <text x="36" y="157.0" class="name">ryjwt → BaseModel (Python)</text>
    <text x="36" y="170.0" class="rate">29,877 decodes/s</text>
    <g id="badge-ryjwt-pydantic" opacity="0">
      <text x="700" y="164.0" class="badge" fill="#007a00">&#x2713; 3.35s</text>
    </g>
  </g>
  <g>
    <rect x="243" y="184" width="447" height="26" rx="4" class="track" />
    <rect id="bar-jsonwebtoken" x="243" y="184" width="0" height="26" rx="4" fill="#eb6834" />
    <rect x="20" y="197.0" width="10" height="10" rx="2" fill="#eb6834" />
    <text x="36" y="199.0" class="name">jsonwebtoken (Rust)</text>
    <text x="36" y="212.0" class="rate">29,007 decodes/s</text>
    <g id="badge-jsonwebtoken" opacity="0">
      <text x="700" y="206.0" class="badge" fill="#eb6834">&#x2713; 3.45s</text>
    </g>
  </g>
  <g>
    <rect x="243" y="226" width="447" height="26" rx="4" class="track" />
    <rect id="bar-fast-jwt" x="243" y="226" width="0" height="26" rx="4" fill="#4a3aa7" />
    <rect x="20" y="239.0" width="10" height="10" rx="2" fill="#4a3aa7" />
    <text x="36" y="241.0" class="name">fast-jwt (Bun)</text>
    <text x="36" y="254.0" class="rate">28,183 decodes/s</text>
    <g id="badge-fast-jwt" opacity="0">
      <text x="700" y="248.0" class="badge" fill="#4a3aa7">&#x2713; 3.55s</text>
    </g>
  </g>
  <g>
    <rect x="243" y="268" width="447" height="26" rx="4" class="track" />
    <rect id="bar-jose" x="243" y="268" width="0" height="26" rx="4" fill="#eda100" />
    <rect x="20" y="281.0" width="10" height="10" rx="2" fill="#eda100" />
    <text x="36" y="283.0" class="name">jose (Bun)</text>
    <text x="36" y="296.0" class="rate">23,293 decodes/s</text>
    <g id="badge-jose" opacity="0">
      <text x="700" y="290.0" class="badge" fill="#eda100">&#x2713; 4.29s</text>
    </g>
  </g>
  <g>
    <rect x="243" y="310" width="447" height="26" rx="4" class="track" />
    <rect id="bar-python-jose" x="243" y="310" width="0" height="26" rx="4" fill="#c2378e" />
    <rect x="20" y="323.0" width="10" height="10" rx="2" fill="#c2378e" />
    <text x="36" y="325.0" class="name">python-jose (Python)</text>
    <text x="36" y="338.0" class="rate">18,376 decodes/s</text>
    <g id="badge-python-jose" opacity="0">
      <text x="700" y="332.0" class="badge" fill="#c2378e">&#x2713; 5.44s</text>
    </g>
  </g>
  <g>
    <rect x="243" y="352" width="447" height="26" rx="4" class="track" />
    <rect id="bar-joserfc" x="243" y="352" width="0" height="26" rx="4" fill="#8a5a2b" />
    <rect x="20" y="365.0" width="10" height="10" rx="2" fill="#8a5a2b" />
    <text x="36" y="367.0" class="name">joserfc (Python)</text>
    <text x="36" y="380.0" class="rate">17,331 decodes/s</text>
    <g id="badge-joserfc" opacity="0">
      <text x="700" y="374.0" class="badge" fill="#8a5a2b">&#x2713; 5.77s</text>
    </g>
  </g>
  <g>
    <rect x="243" y="394" width="447" height="26" rx="4" class="track" />
    <rect id="bar-pyjwt" x="243" y="394" width="0" height="26" rx="4" fill="#2a78d6" />
    <rect x="20" y="407.0" width="10" height="10" rx="2" fill="#2a78d6" />
    <text x="36" y="409.0" class="name">PyJWT (Python)</text>
    <text x="36" y="422.0" class="rate">13,624 decodes/s</text>
    <g id="badge-pyjwt" opacity="0">
      <text x="700" y="416.0" class="badge" fill="#2a78d6">&#x2713; 7.34s</text>
    </g>
  </g>
  <g>
    <rect x="243" y="436" width="447" height="26" rx="4" class="track" />
    <rect id="bar-jwcrypto" x="243" y="436" width="0" height="26" rx="4" fill="#5f6b7a" />
    <rect x="20" y="449.0" width="10" height="10" rx="2" fill="#5f6b7a" />
    <text x="36" y="451.0" class="name">jwcrypto (Python)</text>
    <text x="36" y="464.0" class="rate">11,993 decodes/s</text>
    <g id="badge-jwcrypto" opacity="0">
      <text x="700" y="458.0" class="badge" fill="#5f6b7a">&#x2713; 8.34s</text>
    </g>
  </g>

  <text x="20" y="498" class="caption">ES256 with a PEM public key, a typical 704-byte token. Each bar takes 100,000 &#215; the library's mean time per decode.</text>
  <text x="20" y="514" class="caption">Measured in Docker, one container per library, each on one pinned CPU core.</text>

</svg>
