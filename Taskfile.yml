# https://taskfile.dev

version: '3'

includes:
  tmp:
    taskfile: ./Taskfile.tmp.yml
    optional: true

tasks:
  run: uv run ./main.py {{.CLI_ARGS}}

  uv-sync: uv sync --all-packages --all-groups

  uv-lock: uv lock {{.CLI_ARGS}}

  ruff: uv run ruff check --fix --unsafe-fixes .

  pyright: uv run pyright .

  test: uv run pytest {{.CLI_ARGS}}

  rustfmt: cargo fmt

  clippy: cargo clippy --release --all-targets -- -D warnings

  lint:
    desc: 'Check formatting and lints (rustfmt, clippy pedantic, ruff), without changing files'
    cmds:
      - cargo fmt --check
      - cargo clippy --release --all-targets -- -D warnings
      # --only-group: ruff needs only the dev tools, not the extension built and installed.
      - uv run --only-group dev ruff check --no-fix .
      - uv run --only-group dev ruff format --check .

  typecheck:
    desc: 'Type-check the package (./python) with pyright, then the public interface (task typecheck-public)'
    cmds:
      - uv run pyright python
      - task: typecheck-public

  typecheck-public:
    desc: 'Type-check the public interface (./tests, but not ./tests/typing_errors, which test_typing_errors.py checks) with mypy, ty, pyright, zuban & pyrefly. Runs all, fails if any do.'
    cmd: |
      set -u
      rc=0
      # pyproject.toml excludes tests/typing_errors for the others; pyrefly ignores that when given paths.
      for tool in "mypy tests" "ty check tests" "pyright tests" "zuban check tests" "pyrefly check tests --project-excludes tests/typing_errors"; do
        echo "──── uv run ${tool} ────"
        uv run ${tool} || rc=1
      done
      exit ${rc}

  docs:
    desc: 'Serve the documentation site (zensical.toml) at http://localhost:8000, rebuilding it as the docs change'
    # --only-group: the API reference reads the sources statically, so the extension isn't needed.
    cmd: uv run --only-group docs zensical serve {{.CLI_ARGS}}

  docs-test:
    desc: 'Build the documentation site in strict mode, as CI does: any warning (a broken link or anchor, an unresolved API reference, a missing included file) fails it'
    cmd: uv run --only-group docs zensical build --strict --clean

  icons:
    desc: 'Render the raster icons (assets/favicon-32.png, favicon.ico, apple-touch-icon.png) from assets/favicon.svg, and copy it to docs/assets/ (needs rsvg-convert: brew install librsvg)'
    dir: assets
    # --only-group: the script needs Pillow and yeetr, not the extension built and installed.
    cmd: uv run --only-group icons yeet ./build_icons.py

  licenses:
    desc: 'Regenerate THIRD_PARTY_LICENSES, the licenses of the crates compiled into the extension (needs cargo-about: cargo install --locked --features cli cargo-about@0.9.2)'
    cmds:
      - cargo fetch --locked
      - cargo about generate --frozen --fail --output-file THIRD_PARTY_LICENSES about.hbs

  bench-docker:
    desc: 'Benchmark every implementation in its own container (1 core, 500 MB), one after another; results in bench/results-docker'
    dir: bench
    cmds:
      - docker compose build
      - |
        set -eu
        for service in pyjwt python-jose joserfc jwcrypto ryjwt ryjwt-msgspec ryjwt-pydantic jose fast-jwt jsonwebtoken; do
          echo "──── ${service} ────"
          docker compose run --rm "${service}"
        done
      - uv run --group bench yeet ./compare.py results-docker
      - uv run --group bench yeet ./compare.py results-docker markdown "Run in Docker, one container per library, each limited to 1 CPU (pinned) and 500 MB with no swap."

  bench-fixtures:
    desc: 'Regenerate the bench fixtures (bench/fixtures.json, and the full matrix in bench/matrix, reusing its stored keys) and the JWKS server''s test TLS certificates'
    dir: bench
    cmds:
      - uv run --group bench yeet ./gen_fixtures.py
      - uv run --group bench yeet ./gen_tls.py

  bench-matrix:
    desc: 'Benchmark the full matrix (algorithm x key size x payload x key source) in Docker, one library container after another (1 core, 500 MB), against an HTTPS JWKS server; results in bench/results-matrix, page in bench/results-matrix.md'
    dir: bench
    cmds:
      - docker compose build
      - defer: docker compose rm --stop --force jwks
      - |
        set -eu
        for service in matrix-pyjwt matrix-python-jose matrix-joserfc matrix-jwcrypto matrix-ryjwt matrix-ryjwt-msgspec matrix-ryjwt-pydantic matrix-jose matrix-fast-jwt matrix-jsonwebtoken; do
          echo "──── ${service} ────"
          docker compose run --rm "${service}"
        done
      - uv run --group bench yeet ./compare.py:matrix results-matrix "Run in Docker, one container per library, each limited to 1 CPU (pinned) and 500 MB with no swap; the JWKS server runs in a container of its own, outside that limit."

  bench-race:
    desc: 'Benchmark just the races'' two cases of the matrix (HS256 typical-k64 from the secret, ES256 typical-es256 from the PEM), as bench-matrix does, into bench/results-race; then redraw the races'
    dir: bench
    env:
      MATRIX_RESULTS: results-race
    vars:
      # The races' cases (race_svg.py's Races.races): the sources and cases to run.
      SOURCES: hmac,pem
      CASES: typical-k64,typical-es256
    cmds:
      - docker compose build
      - |
        set -eu
        for impl in pyjwt python-jose joserfc jwcrypto ryjwt ryjwt-msgspec ryjwt-pydantic; do
          echo "──── ${impl} ────"
          docker compose run --rm --no-deps "matrix-${impl}" "${impl}" https://jwks:8443 {{.SOURCES}} {{.CASES}}
        done
        for impl in jose fast-jwt; do
          echo "──── ${impl} ────"
          docker compose run --rm --no-deps "matrix-${impl}" "${impl}" https://jwks:8443 {{.SOURCES}} {{.CASES}}
        done
        echo "──── jsonwebtoken ────"
        docker compose run --rm --no-deps matrix-jsonwebtoken 1 {{.SOURCES}} {{.CASES}}
      - task: race-svg

  bench-download:
    desc: 'Put a Benchmarks workflow run''s results in place (the results files and pages, and the races in assets/ and docs/assets/), from its artifact, and show the machine they ran on (needs gh): task bench-download -- <run id>'
    cmds:
      - |
        set -eu
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        gh run download {{.CLI_ARGS}} --dir "$dir"
        machine=$(find "$dir" -name machine.txt | head -n 1)
        test -n "$machine" || { echo "No benchmark results in run {{.CLI_ARGS}}" >&2; exit 1; }
        artifact=$(dirname "$machine")
        cat "$machine"
        parts=$(cd "$artifact" && ls -d bench assets 2>/dev/null || true)
        tar -C "$artifact" -cf - $parts | tar -xvf -
        if [ -d "$artifact/assets" ]; then cp "$artifact"/assets/perf-race*.svg docs/assets/; fi

  race-svg:
    desc: 'Redraw the decode races (assets/perf-race.svg, HS256, and assets/perf-race-es256.svg, ES256; copied to docs/assets/) from bench-race''s results in bench/results-race'
    dir: bench
    cmd: uv run --group bench yeet ./race_svg.py {{.CLI_ARGS}}
