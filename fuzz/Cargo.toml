# The fuzz targets (cargo-fuzz: libFuzzer and AddressSanitizer, on nightly Rust), run with
# `task fuzz`. A package and workspace of its own, outside ryjwt's: nothing here is built into the
# wheels, and its Cargo.lock (which `task fuzz-build` copies from ryjwt's, so it fuzzes the versions
# the wheels are built with) isn't committed.
[package]
name = "ryjwt-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# libFuzzer's bindings, pinned (as the nightly is) so a new release can't change the scheduled runs
# unannounced, with arbitrary, the one dependency of theirs ryjwt's Cargo.lock doesn't hold. Bump
# them by hand.
arbitrary = "=1.5.0"
libfuzzer-sys = "=0.4.13"
# ryjwt's version, whatever it is: "*" keeps the one in the Cargo.lock copied from ryjwt's (cargo
# keeps a locked version that meets a requirement), and only one copy of PyO3 can link libpython.
pyo3 = "*"
ryjwt = { path = ".." }

[build-dependencies]
pyo3-build-config = "*" # PyO3's own, so ryjwt's version too

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# Symbols for the stack traces of crashes.
[profile.release]
debug = 1

[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "claims"
path = "fuzz_targets/claims.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode"
path = "fuzz_targets/encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwks"
path = "fuzz_targets/jwks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keys"
path = "fuzz_targets/keys.rs"
test = false
doc = false
bench = false
